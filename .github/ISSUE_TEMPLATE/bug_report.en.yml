name: Bug report
description: Report a reproducible problem in English
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not include secrets, private data, or vulnerability details. For security concerns, use SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, commit, or date
      placeholder: e.g. v1.2.3 or abc1234
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, browser, deployment mode, and relevant configuration (sanitized).
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Remove credentials, personal data, private URLs, and production records.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
        - label: This is not a security vulnerability report.
          required: true
